[env:esp32dev]
; Wokwi / simulation build
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DSIMULATION=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

[env:real]
; Real hardware build (needs src/secrets.h)
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DSIMULATION=0
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
    marcoschwartz/LiquidCrystal_I2C@^1.1.4